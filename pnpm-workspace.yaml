allowBuilds:
  core-js: true
  # cpu-features is an optional pg dependency; its native build aborts the
  # process on aarch64 (unfixable symbol error), and pg runs fine without it.
  cpu-features: false
  esbuild: true
  msw: true
  protobufjs: true
  ssh2: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 0.3.3
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
