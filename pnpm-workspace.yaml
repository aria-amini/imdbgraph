allowBuilds:
  core-js: true
  # cpu-features is an optional pg dependency; its native build aborts the
  # process on aarch64 (unfixable symbol error), and pg runs fine without it.
  cpu-features: false
  esbuild: true
  msw: true
  protobufjs: true
  ssh2: true
catalog:
  '@vitest/browser-playwright': 5.0.3
  '@vitest/ui': 5.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
# Matches the CI install policy, so local resolution never picks a release
# that CI rejects.
minimumReleaseAge: 1440
# First-party packages publish only from the toolkit release workflow, after
# its checks pass.
minimumReleaseAgeExclude:
  - '@aamini/*'
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitest: '*'
