[build]
builder = "RAILPACK"
buildCommand = "vp build"

[deploy]
preDeployCommand = "pnpm run db:migrate && pnpm run db:populate --if-empty"
runtime = "V2"
numReplicas = 1
startCommand = "pnpm start"
healthcheckPath = "/"
useLegacyStacker = false
restartPolicyType = "ALWAYS"
healthcheckTimeout = 300
