name: CodeRabbit Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  coderabbit-gate:
    if: >-
      github.event_name == 'pull_request' || (
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'coderabbitai[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Verify CodeRabbit review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER:
            ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            sha="$PR_HEAD_SHA"
            gh api "repos/$REPOSITORY/statuses/$sha" \
              -f state=pending \
              -f context='CodeRabbit / verified' \
              -f description='Waiting for CodeRabbit to review this commit.'
            exit 0
          fi

          sha=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          body="$COMMENT_BODY"

          if [[ "$body" == *"Review rate limited"* ||
            "$body" == *"Action not completed"* ]]; then
            state=failure
            description='CodeRabbit review did not complete.'
          elif [[ "$body" == *"Review triggered"* ||
            "$body" == *"review in progress"* ]]; then
            state=pending
            description='CodeRabbit is reviewing this commit.'
          elif [[ "$body" == *"Review finished"* ||
            "$body" == *"Action performed"* ||
            "$body" == *"Actionable comments posted"* ]]; then
            state=success
            description='CodeRabbit reviewed this commit.'
          else
            exit 0
          fi

          gh api "repos/$REPOSITORY/statuses/$sha" \
            -f state="$state" \
            -f context='CodeRabbit / verified' \
            -f description="$description"
