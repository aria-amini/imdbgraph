#:schema https://pitchfork.jdx.dev/schema.json

# The daemon namespace derives from the directory name, so each jj workspace
# (wt switch) gets isolated daemons with its own ports from mise-tasks/setup.

[daemons.dev]
run = "exec vp dev"
mise = true
auto = ["start", "stop"]
retry = 3
boot_start = true
ready_output = "Local:"
